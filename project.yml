name: Neximed
options:
  bundleIdPrefix: com.neximed
  developmentLanguage: es
  knownRegions:
    - en
    - es
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  Neximed:
    type: application
    platform: iOS
    # NOTA: la clave `resources:` separada está rota en la instalación local
    # de xcodegen (2.45.3 y 2.46.0 probados) — genera el .xcodeproj sin
    # ninguna fase "Copy Bundle Resources", así que Assets.xcassets nunca
    # llega al bundle (sin icono, sin pantalla de lanzamiento, sin imágenes
    # de fondo). Workaround verificado: declarar la carpeta de recursos como
    # una entrada más de `sources:` — xcodegen SÍ detecta y enruta
    # correctamente los no-.swift (Assets.xcassets, Images, xcstrings) a
    # Resources cuando están dentro de `sources:`.
    sources:
      - path: Neximed/Sources/Neximed
      - path: Neximed/Resources
        excludes:
          - Info.plist
          - "*.entitlements"
    info:
      path: Neximed/Resources/Info.plist
      properties:
        CFBundleName: Neximed
        CFBundleDisplayName: Neximed
        CFBundleIdentifier: com.neximed.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        NSHealthShareUsageDescription: Neximed lee tus constantes de Apple Health (FC reposo, HRV, descanso) para estructurarlas en tu dossier médico personal. Todos los datos se procesan únicamente en tu dispositivo.
        NSHealthUpdateUsageDescription: Neximed permite guardar registros de alimentación y parámetros clínicos organizados en Apple Health.
        NSMicrophoneUsageDescription: Neximed utiliza el micrófono para que puedas dictar síntomas, notas médicas y preguntas con total comodidad mediante voz.
        NSSpeechRecognitionUsageDescription: Neximed utiliza el reconocimiento de voz en el dispositivo para transcribir y pulir tus notas de salud con IA antes de guardarlas.
        NSCameraUsageDescription: Neximed usa la cámara para escanear informes médicos en papel o platos de comida.
        NSPhotoLibraryUsageDescription: Neximed permite importar fotos o PDFs de analíticas de laboratorio desde tu biblioteca.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: splash-centerpiece
        CFBundleURLTypes:
          - CFBundleURLName: com.neximed.app
            CFBundleURLSchemes:
              - neximed
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities:
          - arm64
          - healthkit
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Neximed/Resources/Neximed.entitlements
      # XcodeGen regenera este archivo desde properties en cada xcodegen generate.
      # Sin esto, una regeneracion sobrescribia el fichero con un dict vacio
      # y la app perdia HealthKit y Siri.
      #
      # NOTA: com.apple.developer.foundation-models NO es un entitlement real.
      # Apple Intelligence / FoundationModels no requiere entitlement de app —
      # el acceso se controla en runtime por capacidad del dispositivo
      # (SystemLanguageModel.default.availability), no por provisioning.
      # Se quitó tras confirmar el error de Xcode: "not found and could not
      # be included in profile... not a valid entitlement".
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.siri: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neximed.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  NeximedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NeximedTests
    dependencies:
      - target: Neximed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neximed.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Neximed.app/Neximed"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Neximed:
    build:
      targets:
        Neximed: all
    test:
      targets:
        - NeximedTests
    run:
      config: Debug
    archive:
      config: Release